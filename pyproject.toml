[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "USP"
version = "0.1.0"
description = "Analysis tools for E. coli fermentation (upstream processing) data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Florian Gisperg" }]
keywords = ["fermentation", "bioprocess", "E. coli", "upstream-processing", "bioreactor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib>=3.9",
    "seaborn",
    "scipy",
    "openpyxl",   # reading .xlsx offline sample files
    "PyYAML",     # config loading
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.5",
    "pytest-cov>=2.12.1",
    "black>=21.5b2",
    "isort>=5.9.1",
    "flake8>=3.9.2",
    "pandas-stubs>=2.3",
]
dashboard = [
    "bokeh>=3.8", # interactive HTML dashboards (InteractiveDashboard)
]

[project.urls]
Homepage = "https://github.com/floriangisperg/USP"
Documentation = "https://github.com/floriangisperg/USP#readme"
Issues = "https://github.com/floriangisperg/USP/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
