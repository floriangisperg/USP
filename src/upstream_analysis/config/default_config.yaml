# src/upstream_analysis/config/default_config.yaml
# --- Default settings for the analysis library ---

parsing:
  bioreactor:
    decimal_separator: ','
    column_separator: ';'
    date_format: '%d.%m.%Y %H:%M'
    skiprows: 1
  offline:
    decimal_separator: '.'
    column_separator: ','
    date_format: 'guess'
    sheet_name: 0

# Standard Column Mapping (Override in run_config if needed)
column_mapping:
   # --- Online Data ---
   # 'Raw Header from CSV': standard_internal_name
   'Date Time UTC':                  Date time [UTC]
   'Date Local Time':                Date time [local]
   'Batch Time, sec':                Batch time [s]
   'Batch Time (since inoc.), sec':  Batch time since inoculation [s]
   'Phase':                          Process phase [-]
   'Phase Time, sec':                Phase time [s]
   'Foam, -':                        Foam [-]
   'AirFlow, l/min':                 Air flow [L/min]
   'TotalFlow, l/min':               Total flow [L/min]
   'Gas2Flow, l/min':                O2 flow [L/min]
   'GasMix':                         Gas mix [-]
   'Pump1, %':                       Acid pump [%]
   'Pump1.Duration, -':              Acid pump duration [-]
   'Pump2, %':                       Base pump [%]
   'Pump2.Duration, -':              Base pump duration [-]
   'Pump3, %':                       Inducer pump [%]
   'Pump3.Duration, -':              Inducer pump duration [-]
   'Pump4, %':                       Feed pump [%]
   'Pump4.Duration, -':              Feed pump duration [-]
   'Stirrer, 1/min':                 Stirrer speed [1/min]
   'Temperature, °C':                Temperature [°C] # <-- Use the actual degree symbol if your file has it
   # If you still have encoding issues with '°', use the workaround:
   'Temperature, Â°C':             Temperature [°C]
   'Temperature, ¬∞C':             Temperature [°C]  # ferm_05 encoding
   'Balance, g':                     Balance [g]
   'AnalogIO1, %':                   Analog IO1 [%]
   'AnalogIO2, %':                   Analog IO2 [%]
   'pH, -':                          pH [-]
   'pO2, %':                         pO2 [%]
   'GenericGasAnalyser.ExitCO2, %':  Offgas CO2 [%]
   'GenericGasAnalyser.ExitO2, %':   Offgas O2 [%]
   'OD600':                          OD600 online [-]
   'ExponentialFeeding.Feedrate, %': Feed rate exp [%]
   'FeedingInduction.Feedrate2, %':  Feed rate ind [%]

   # --- Offline Data ---
   # 'Raw Header from Samples File': standard_internal_name
   'Process Time [h]':               Process time [h]
   'Biomass [g/L]':                  Biomass [g/L]
   'Glucose [g/L]':                  Glucose [g/L]
   'Protein concentration [g/L]':    Protein [g/L]
   'Protein IB [g/L]':               Protein IB [g/L]
   'Protein soluble [g/L]':          Protein soluble [g/L]
   'Sample volume [mL]':             Sample volume [mL]
   'Acetate [g/L]':                  Acetate [g/L]
   'Viability [%]':                  Viability [%]
   'OD':                             OD600 [-]

# Default Settings for Library Operation
cleaning:
  filter_preparation: true          # Default: Remove 'Preparation' phase
  rename_preparation_to_batch: false # Default is NOT to rename
  balance_tare_correction: true
  calculate_process_time: true
  median_filter: true
  median_filter_columns: ['balance']
  median_filter_window: 10
  median_filter_threshold: 10
  balance_tare_threshold: -100

alignment:
  online_time_col: 'Process time [h]'
  offline_time_col: 'Process time [h]'
  tolerance_hours: 0.1
  save_separate_samples_file: true
  force_align_last_sample: true

processing:
  processing_parameters:
    balance_mode: 'feed_source' # Default assumption: balance measures feed bottle (decreasing weight)
    # --- reactor_setup, gas_params, etc. can remain nested if preferred ---
    # --- or be flattened if you never override them individually ---
    reactor_setup:
      initial_volume_ml: null # Still null, requires run_config
  constants:
    mw_glucose: 180.156 # Still useful as a general constant, though molar mass per C-mol is often more directly used.
  biomass_params: # Default biological properties
    elemental_composition_c_mol: { C: 1.0, H: 1.77, N: 0.24, O: 0.49 }
    molar_mass_g_c_mol: 26.565
    ash_fraction_g_g: 0.08
  product_params:
    name: null
    nitrogen_content_fraction: null
  induced_phases:
    - 'induced Fedbatch'
    - 'Induced fed batch'
    - 'Production'
  # Reference induction time (process-time hours). The SCADA phase transition
  # into the induced phase can LEAD the physical inducer addition (manual IPTG
  # bolus) by minutes to over an hour; set this to the operator-verified
  # induction time to shift 'Is induced [-]' accordingly. A large offset from
  # the phase flip is warned about (tolerance below).
  induction_time_h: null
  # Alternative to induction_time_h: read the operator-noted time from an
  # evaluation workbook (sheet with a labelled event table; the 'Induction'
  # row's decimal 'Time' column, same time zero as Process time [h]).
  # induction_reference_file: 'Evaluation_F16.xlsx'
  # induction_reference_sheet: 'Time-Rownr'
  # induction_reference_label: 'Induction'
  # Warn threshold for |reference - phase flip| [h]; correction applies regardless.
  induction_time_tolerance_h: 0.25
  gas_params:
    o2_in_air_percent: 21.0      # O2 fraction in air (%)
    co2_in_air_percent: 0.04     # CO2 fraction in air (%)
    inlet_h2o_mol_pct: 0.0       # Inlet H2O vapor (% mol/mol)
    outlet_h2o_mol_pct: 0.0      # Outlet H2O vapor (% mol/mol)
    offgas_is_wet: false         # True if offgas O2/CO2 are reported on wet basis
    use_n2_balance: false        # Use N2 balance for CER/OUR (requires inlet/outlet fractions)
    molar_volume_air_l_mol: 22.414 # Molar volume (L/mol) at STP
    calculate_inlet_composition: true
    calculate_cer: true          # CO2 Evolution Rate
    calculate_our: true          # O2 Uptake Rate
    calculate_rq: true           # Respiratory Quotient
    calculate_specific_rates: true # Per biomass (qO2, qCO2)
  filtering: # Specific to feed calculations
    apply_feed_filter: true
    median_filter_window: 5
    median_filter_threshold: 10
  rate_params:
    apply_smoothing: true
    smoothing_window_points: 5
    smoothing_min_periods: 1
    interpolation_method: 'spline' # spline or linear
    spline_order: 3
    spline_smoothing: 0.0

# Placeholders
analysis: {}
visualization: {}
