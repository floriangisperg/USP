# Synthetic demo run — data generated by generate_data.py with DASGIP-style
# headers and German CSV format, so the package defaults apply unchanged:
# NO parsing overrides and NO column_mapping needed. That is the point: this
# file shows the minimal config a well-formed export requires.

metadata:
  fermentation_id: "synthetic_demo"
  strain: "E. coli BL21(DE3) [simulated]"
  reactor: "2 L glass (simulated)"

processing:
  processing_parameters:
    reactor_setup:
      initial_volume_ml: 1500.0     # REQUIRED — matches generate_data.py
    balance_mode: 'feed_source'     # Balance tracks the feed bottle (decreasing)
    feed_definitions:
      feed_1:                       # feed linked to Pump4
        name: 'Glucose feed (400 g/L)'
        density_g_ml: 1.15          # physical density of a 400 g/L solution
    base_titrant:                   # pH control via Pump2 (NH4OH)
      compound: 'NH4OH'
      molarity_mol_l: 6.95
      density_g_ml: 0.947
      total_added_g: 15.0
    product_properties:
      name: 'demo_protein'

  induced_phases:
    - 'induced Fedbatch'            # matches the Phase column generated above
