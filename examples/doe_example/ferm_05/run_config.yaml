# examples/real_data_example/run_config.yaml
# --- Experiment-Specific Configuration Template ---

# ==================================================
# 1. METADATA
# ==================================================
metadata:
  fermentation_id: 'CDL_scFv_His_DoE' # UPDATED
  date_start: '2023-07-03'             # UPDATED
  strain: 'E. coli BL21DE3 (pET)'      
  reactor: 'MF2 R1'                    
  media_base: 'DeLisa Glucose'
  induction_summary: '1mM IPTG, qs=0.6, T=25°C, 8h' # UPDATED
  media_config_file: 'delisa_media_config.yaml'

# ==================================================
# 2. COLUMN MAPPING OVERRIDE (Optional)
# ==================================================
# Define here ONLY if headers DIFFER from default_config.yaml
# column_mapping:
#    'Some Different Header': date_time_utc

# ==================================================
# 3. PROCESSING PARAMETERS - Values Specific to THIS Run
# ==================================================
processing_parameters:

  reactor_setup:
    initial_volume_ml: 1100.0

  gas_params:
    inlet_o2_mol_pct: 21.0          
    inlet_co2_mol_pct: 0.04         
    inlet_h2o_mol_pct: 0.004761905  # UPDATED
    outlet_o2_wet_mol_pct: 20.9     # (optional, not active)
    air_flow_l_min: 0.12            
    molar_volume_air_l_mol: 25.291  
    molar_volume_temp_c: 35.0       

  feed_definitions:
    feed_1:
      name: 'Glucose Feed'
      density_g_ml: 1.150

  medium_definitions:
    pass

  base_titrant: #12.5% ammonia solution
    compound: 'NH4OH'
    molarity_mol_l: 6.95
    density_g_ml: 0.947
    pump_channel: 'Pump2'
    total_added_g: 0 #64.8 # g

  biomass:
    pass

  substrate_properties:
    glucose:
      molar_mass_g_c_mol: 30.03
    acetate:
      molar_mass_g_c_mol: 29.5

  product_properties:
    name: 'scFv-His'
#    nitrogen_content_gN_gP: 0.1647

# ==================================================
# 4. PROCESSING STEP OVERRIDES (Optional)
# ==================================================
processing_step_overrides:
  processing:
    induced_phases:
      - 'induced Fedbatch'
      - 'Production'
